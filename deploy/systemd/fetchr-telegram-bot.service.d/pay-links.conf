# Drop-in for fetchr-telegram-bot: «Оплатить» goes through the API server's
# tracked redirect (https://fetchr.fun/api/pay/<token>), so the bot reminds
# only buyers who opened the payment page. Install it only after fetchr-api
# serves /pay/ (scripts/lib/pay-redirect.mjs); without it the buttons keep the
# direct Robokassa links.
#
#   install -D -m 644 pay-links.conf /etc/systemd/system/fetchr-telegram-bot.service.d/pay-links.conf
#   systemctl daemon-reload && systemctl restart fetchr-telegram-bot
[Service]
Environment=FETCHR_BOT_PAY_BASE=https://fetchr.fun/api/pay
