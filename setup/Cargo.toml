[package]
name = "fetchr-setup"
version = "0.1.0"
edition = "2021"
description = "Fetchr installer: WebView2 window with the launch intro, zstd payload, silent update mode"
publish = false

[lib]
name = "fetchr_setup"
path = "src/lib.rs"

[[bin]]
name = "fetchr-setup"
path = "src/main.rs"

[[bin]]
name = "fetchr-pack"
path = "src/bin/pack.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
zstd = { version = "0.13", features = ["zstdmt"] }

[target.'cfg(windows)'.dependencies]
tao = "0.34.8"
wry = "0.54.4"
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
