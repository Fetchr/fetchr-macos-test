<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Установка Fetchr</title>
<style>
/* Окно установщика: ASCII-поле во весь кадр, локап по центру, под ним
   панель состояния. Цвета и кривые — из заставки запуска приложения. */
:root {
  --bg: #06070a;
  --ink: #f3f6fb;
  --mute: #8b90a0;
  --faint: #5d6270;
  --line: rgba(243, 246, 251, .1);
  --accent: #3d7dff;
  --accent-hi: #5b93ff;
  --danger: #ff6b6b;
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--ui); user-select: none; }
canvas.ascii { position: fixed; inset: 0; width: 100%; height: 100%; }
.glow-wrap { position: fixed; left: 50%; top: 42%; width: 70vw; aspect-ratio: 1; translate: -50% -50%; pointer-events: none; }
.glow {
  position: absolute; inset: 0;
  background: radial-gradient(closest-side, rgba(61,125,255,.34), rgba(61,125,255,.08) 55%, transparent 75%);
  opacity: 0; pointer-events: none;
}
.titlebar { position: fixed; inset: 0 0 auto; height: 40px; display: flex; align-items: center; gap: 10px; padding-left: 16px; z-index: 5; }
.titlebar .name { font-size: 12.5px; color: var(--mute); }
.titlebar .ver { font: 11px var(--mono); color: var(--faint); }
.titlebar .sp { flex: 1; align-self: stretch; }
.titlebar svg.mark { width: 14px; height: 14px; }
.wb { width: 46px; height: 40px; border: 0; background: transparent; color: var(--mute); display: grid; place-items: center; cursor: default; }
.wb:hover { background: rgba(255,255,255,.06); color: var(--ink); }
.wb.close:hover { background: #c42b1c; color: #fff; }
.wb svg { width: 10px; height: 10px; }
.lock { position: fixed; left: 50%; top: 42%; width: 46%; aspect-ratio: 407 / 107; translate: -50% -50%; }
.lock > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mono { font-family: var(--mono); font-weight: 600; }

.panel { position: fixed; left: 50%; bottom: 44px; width: 380px; translate: -50% 0; display: grid; gap: 10px; z-index: 4; }
.view { display: grid; gap: 10px; opacity: 0; translate: 0 8px; pointer-events: none; transition: opacity .35s cubic-bezier(.16,1,.3,1), translate .35s cubic-bezier(.16,1,.3,1); grid-area: 1 / 1; }
.view.on { opacity: 1; translate: 0 0; pointer-events: auto; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.5px; }
.row .label { color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .pct { font: 600 12px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--accent); box-shadow: 0 0 12px rgba(61,125,255,.8); }
.path { font: 11px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg { font-size: 13px; color: var(--ink); text-align: center; text-wrap: balance; }
.msg.small { font-size: 12px; color: var(--mute); }
.actions { display: flex; justify-content: center; gap: 10px; }
.btn {
  font: 600 13.5px var(--ui); color: #fff; background: var(--accent); border: 0; border-radius: 999px;
  padding: 11px 26px; cursor: pointer; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 28px rgba(61,125,255,.35);
  transition: background .15s, transform .15s;
}
.btn:hover { background: var(--accent-hi); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--mute); box-shadow: none; padding: 11px 16px; }
.btn.ghost:hover { color: var(--ink); background: rgba(255,255,255,.05); }
.btn:focus-visible, .wb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.error .msg { color: var(--danger); }
</style>
</head>
<body>
<canvas class="ascii"></canvas>
<div class="glow-wrap"><div class="glow"></div></div>

<div class="titlebar" id="drag">
  <svg class="mark" viewBox="14 14 77 75" aria-hidden="true"><path fill="#3d7dff" id="titleMark"/></svg>
  <span class="name">Установка Fetchr</span><span class="ver" id="ver"></span>
  <span class="sp"></span>
  <button class="wb" id="min" type="button" aria-label="Свернуть"><svg viewBox="0 0 10 10"><rect y="4.5" width="10" height="1" fill="currentColor"/></svg></button>
  <button class="wb close" id="close" type="button" aria-label="Закрыть"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.1"/></svg></button>
</div>

<div class="lock"><svg viewBox="-6 -2 407 107" overflow="visible" id="svg">
  <defs><mask id="m" maskUnits="userSpaceOnUse" x="-20" y="-20" width="160" height="140"><rect x="-20" y="-20" width="160" height="140" fill="#fff"/></mask></defs>
  <g id="scene">
    <g id="fx"></g>
    <g id="markGroup"><path id="body" fill="#3d7dff" mask="url(#m)"/><rect id="chip" x="67" y="48" width="24" height="19" rx="4" fill="#3d7dff"/></g>
    <g id="letters"></g>
    <g id="fxTop"></g>
  </g>
</svg></div>

<div class="panel">
  <div class="view" id="vProgress">
    <div class="row"><span class="label" id="label">Подготовка</span><span class="pct" id="pct">0%</span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="path" id="path"></div>
  </div>
  <div class="view" id="vDone">
    <div class="actions"><button class="btn" id="launch" type="button">Запустить Fetchr</button></div>
    <div class="msg small" id="doneText">Fetchr установлен</div>
  </div>
  <div class="view error" id="vError">
    <div class="msg" id="errText">Установка не удалась</div>
    <div class="actions"><button class="btn" id="retry" type="button">Повторить</button><button class="btn ghost" data-close type="button">Закрыть</button></div>
  </div>
  <div class="view" id="vWarn">
    <div class="msg" id="warnText"></div>
    <div class="actions" id="warnActions"></div>
  </div>
</div>

<script>/*__GSAP__*/</script>
<script>
"use strict";
const WORD = "M135.32 88.18C147.42 88.18 157.02 81.17 158.98 71.03H147.42C146 75.44 141.83 78.43 135.61 78.43C127.28 78.43 122.48 72.79 122.19 64.37H159.62V60.98C159.62 45.11 149.72 34.09 134.83 34.09C120.33 34.09 110.09 45.45 110.09 61.18C110.09 76.86 119.79 88.18 135.32 88.18ZM122.29 55.84C123.12 48.44 127.87 43.89 135.02 43.89C142.18 43.89 146.98 48.44 147.76 55.84ZM176 22H189V39H205L202 50H189V68Q189 75 197 75H204V84Q199 88 192 88Q175 88 175 70V50H166V39H176ZM232.37 88.18C245.45 88.18 254.95 79.75 255.83 68.43H243.64C242.46 74.16 238.98 77.89 232.51 77.89C224.38 77.89 219.58 71.37 219.58 61.18C219.58 50.94 224.43 44.38 232.51 44.38C238.93 44.38 242.8 48.25 243.73 53.78H255.83C254.76 42.27 245.35 34.09 232.37 34.09C217.23 34.09 207.09 45.21 207.09 61.18C207.09 77.15 217.23 88.18 232.37 88.18ZM267 14H281V46Q290 37 302 37Q324 37 324 63V87H310V65Q310 51 299 51Q287 51 281 65V87H267ZM337 38H351V47Q360 36 372 37Q377 37 381 39L377 52Q373 51 369 51Q351 52 351 71V87H337Z";
const WP = WORD.split(/(?=M)/);
const LETTERS = [WP[0] + WP[1], WP[2], WP[3], WP[4], WP[5]];
const LETTER_RIGHT = 381;
const BODY = "M18 14H87Q91 14 91 18V29Q91 33 87 33H34V48H43Q47 48 47 52V63Q47 67 43 67H34V80Q34 84 30 84H18Q14 84 14 80V18Q14 14 18 14Z";
const FRAG = "M71 48H87Q91 48 91 52V63Q91 67 87 67H71Q67 67 67 63V52Q67 48 71 48Z";
const TEXT = "#F3F6FB";
const SHIFT = (14 + 381) / 2 - (14 + 91) / 2;
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const post = (m) => { if (window.ipc) window.ipc.postMessage(m); };

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
  parent.appendChild(n);
  return n;
}

/* ---------- ASCII-поле: порт asciiBackdrop.ts ---------- */
const RAMP = " .:-=+*#%@";
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const PAL = [[16, 28, 58], [32, 64, 150], [61, 125, 255], [150, 190, 255], [225, 238, 255]];
function pal(v) {
  const x = Math.max(0, Math.min(.999, v)) * (PAL.length - 1);
  const i = Math.floor(x), f = x - i, a = PAL[i], b = PAL[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) { return .55 * noise(x, y) + .3 * noise(x * 2.1 + 3.7, y * 2.1 - 1.3) + .15 * noise(x * 4.3 - 2.2, y * 4.3 + 5.1); }

const bg = { scroll: 0, fade: 0, calm: 0, ring: 0, ringA: 0, flow: 0 };
(function ascii(canvas) {
  const ctx = canvas.getContext("2d");
  const rows = 46;
  const t0 = performance.now();
  let lastScroll = 0, lastT = 0, speed = 0;
  function frame(now) {
    const time = (now - t0) / 1000;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const aspect = w / h, cols = Math.round((rows * aspect) / .614), cw = w / cols, ch = h / rows;
    const dt = time - lastT;
    // Пока идёт установка, поле течёт само: это и есть «поток» распаковки
    bg.scroll += bg.flow * dt * 300;
    const vel = dt > 0 ? Math.abs(bg.scroll - lastScroll) / dt : 0;
    speed += (Math.min(1, vel / 600) - speed) * .25;
    lastScroll = bg.scroll; lastT = time;
    ctx.fillStyle = "#06070A";
    ctx.fillRect(0, 0, w, h);
    if (bg.fade > .001) {
      ctx.font = `600 ${Math.round(ch * .82)}px ${getComputedStyle(document.documentElement).getPropertyValue("--mono")}`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const drift = time * .05 + bg.scroll * .0016;
      for (let r = 0; r < rows; r++) {
        const ny = ((r + .5) / rows) * 2 - 1;
        for (let c = 0; c < cols; c++) {
          const ax = (((c + .5) / cols) * 2 - 1) * aspect;
          const n = fbm(ax * 1.1 + drift, ny * 1.4 - time * .03);
          let light = Math.pow(n, 1.7) * .75;
          const ribbon = Math.sin(ax * 1.4 + ny * 2.6 + time * .22 + bg.scroll * .0012 + n * 3.2);
          light += Math.pow(Math.max(0, ribbon), 6) * .42 * (.6 + .4 * n);
          const beam = Math.exp(-Math.pow((ny + .16) / (.05 + .03 * speed), 2)) * (.25 + .75 * speed) * (.6 + .4 * noise(ax * 6 + bg.scroll * .05, 3.3));
          light += beam * (1 - .6 * bg.calm);
          if (bg.ringA > .001) {
            const d = Math.hypot(ax * .62, (ny + .16) * 1.25) + (noise(ax * 3, ny * 3) - .5) * .08;
            light += Math.exp(-Math.pow((d - bg.ring) / .09, 2)) * bg.ringA * .55;
          }
          const dist = Math.hypot(ax / 1.5, (ny + .16) / .8);
          light *= (.22 + .78 * Math.max(0, Math.min(1, (dist - .18) / .38))) * bg.fade * .55;
          light += (BAYER[r & 3][c & 3] / 16 - .5) / RAMP.length;
          const idx = Math.floor(light * RAMP.length);
          if (idx <= 0) continue;
          const [cr, cg, cb] = pal(light * 1.05);
          ctx.fillStyle = `rgba(${cr | 0},${cg | 0},${cb | 0},${Math.min(1, .18 + light).toFixed(2)})`;
          ctx.fillText(RAMP[Math.min(RAMP.length - 1, idx)], (c + .5) * cw, (r + .5) * ch);
        }
      }
      const g = ctx.createRadialGradient(w / 2, h * .42, Math.min(w, h) * .12, w / 2, h * .42, Math.max(w, h) * .6);
      g.addColorStop(0, "rgba(6,7,10,0.1)"); g.addColorStop(.65, "rgba(6,7,10,0.55)"); g.addColorStop(1, "rgba(2,3,4,0.9)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})(document.querySelector("canvas.ascii"));

/* ---------- Сцена «Проявка» ---------- */
$("titleMark").setAttribute("d", BODY + FRAG);
$("body").setAttribute("d", BODY);
const lettersG = $("letters");
const letters = LETTERS.map((d) => el("path", { d, fill: TEXT }, lettersG));
const scene = $("scene"), fx = $("fx"), fxTop = $("fxTop"), markGroup = $("markGroup"), glowEl = document.querySelector(".glow");

function makeFrame(parent) {
  const g = el("g", { opacity: 0, fill: TEXT }, parent);
  const r = Array.from({ length: 6 }, () => el("rect", { rx: .8 }, g));
  const set = (n, x, y, w, h) => { n.setAttribute("x", x); n.setAttribute("y", y); n.setAttribute("width", Math.max(0, w)); n.setAttribute("height", Math.max(0, h)); };
  return {
    g,
    draw({ l, r: rr, t, b, hk, bw }) {
      const th = Math.min(bw, Math.max(0, b - t));
      set(r[0], l, t, bw, b - t); set(r[1], l, t, hk, th); set(r[2], l, b - th, hk, th);
      set(r[3], rr - bw, t, bw, b - t); set(r[4], rr - hk, t, hk, th); set(r[5], rr - hk, b - th, hk, th);
    },
  };
}

function buildIntro() {
  const tl = gsap.timeline({ paused: true });
  gsap.set(scene, { x: SHIFT });
  gsap.set(markGroup, { opacity: 0 });
  gsap.set(letters, { opacity: 0, x: (i) => 26 + i * 30, transformOrigin: "0% 100%" });

  // Клетки знака: какие из них внутри F
  const probe = el("path", { d: BODY + FRAG, fill: "none" }, fx);
  const cols = 24, rows = 15, cw = 77 / cols, ch = 70 / rows;
  const grid = el("g", { class: "mono", "font-size": 5.4, "text-anchor": "middle", "dominant-baseline": "central" }, fx);
  let seed = 5;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = 14 + (c + .5) * cw, y = 14 + (r + .5) * ch;
      const inside = probe.isPointInFill(new DOMPoint(x, y));
      if (!inside && rnd() > .22) continue;
      const t = el("text", { x, y, fill: "#3d7dff", opacity: 0 }, grid);
      const at = .15 + rnd() * .75;
      cells.push({ t, inside, at, settled: "@#%"[Math.floor(at * 100) % 3] });
    }
  }
  probe.remove();

  const SCRAMBLE = 1.25, IMPACT = 1.4;
  const st = { t: 0 };
  tl.fromTo(bg, { fade: 0 }, { fade: 1, duration: 1.4, ease: "sine.inOut" }, 0)
    .fromTo(bg, { scroll: 0 }, { scroll: 600, duration: SCRAMBLE, ease: "power1.inOut" }, 0)
    .fromTo(bg, { ring: .05, ringA: 0 }, { ring: 1.35, duration: 1.3, ease: "power2.out" }, IMPACT)
    .to(bg, { ringA: 1, duration: .08 }, IMPACT)
    .to(bg, { ringA: 0, duration: 1.1, ease: "sine.inOut" }, IMPACT + .08)
    .fromTo(bg, { calm: 0 }, { calm: 1, duration: 1.2, ease: "sine.inOut" }, IMPACT)
    .fromTo(glowEl, { opacity: 0, scale: .5 }, { opacity: .45, scale: 1, duration: .8, ease: "power2.out" }, 0)
    .to(st, {
      t: SCRAMBLE, duration: SCRAMBLE, ease: "none",
      onUpdate() {
        for (const c of cells) {
          const k = (st.t - c.at) / .35;
          if (k <= 0) { c.t.setAttribute("opacity", 0); continue; }
          if (!c.inside) {
            const life = Math.max(0, 1 - Math.abs(k - .6) * 1.4);
            c.t.setAttribute("opacity", (life * .35).toFixed(2));
            c.t.textContent = RAMP[1 + Math.floor(Math.random() * 4)];
            continue;
          }
          const s = Math.min(1, k);
          const [cr, cg, cb] = pal(.35 + s * .45);
          c.t.setAttribute("fill", `rgb(${cr | 0},${cg | 0},${cb | 0})`);
          c.t.setAttribute("opacity", (.3 + s * .7).toFixed(2));
          c.t.textContent = s < 1 ? RAMP[2 + Math.floor(Math.random() * 7)] : c.settled;
        }
      },
    }, 0)
    .call(() => cells.forEach((c) => c.inside && c.t.setAttribute("fill", TEXT)), null, IMPACT)
    .to(markGroup, { opacity: 1, duration: .18, ease: "power2.out" }, IMPACT + .02)
    .fromTo(markGroup, { scaleX: 1.08, scaleY: .9, transformOrigin: "50% 50%" }, { scaleX: 1, scaleY: 1, duration: .5, ease: "elastic.out(1, 0.5)", immediateRender: false }, IMPACT + .02)
    .to(glowEl, { opacity: 1, scale: 1.14, duration: .08, ease: "power2.out" }, IMPACT)
    .to(glowEl, { opacity: .72, scale: 1, duration: .6, ease: "power2.out" }, IMPACT + .08);
  for (const c of cells) {
    const a = Math.atan2(Number(c.t.getAttribute("y")) - 49, Number(c.t.getAttribute("x")) - 52.5);
    tl.to(c.t, { x: Math.cos(a) * 10, y: Math.sin(a) * 10, opacity: 0, duration: .45, ease: "power2.out" }, IMPACT + .04);
  }

  // Рамка схлопывается на знак, локап проезжает на место, слово трекингом
  const at = IMPACT + .1;
  const sel = { l: -4, r: 109, t: -2, b: 100, hk: 7, bw: 3 };
  const frame = makeFrame(fxTop);
  const draw = () => frame.draw(sel);
  tl.call(draw, null, at)
    .set(frame.g, { attr: { opacity: 1 } }, at)
    .to(sel, { l: 5, r: 100, t: 5, b: 93, duration: .5, ease: "power3.out", onUpdate: draw }, at)
    .to(scene, { x: SHIFT + 5, duration: .18, ease: "sine.inOut" }, at + .45)
    .to(scene, { x: 0, duration: .62, ease: "power3.inOut" }, at + .63);
  letters.forEach((letter, i) => {
    const t = at + .68 + i * .03;
    tl.fromTo(letter, { scaleX: 1.28 }, { scaleX: 1, duration: .6, ease: "power3.out" }, t)
      .to(letter, { x: -3, duration: .72, ease: "expo.out" }, t)
      .to(letter, { x: 0, duration: .42, ease: "sine.inOut" }, t + .72)
      .to(letter, { opacity: 1, duration: .32, ease: "power1.out" }, t);
  });
  const last = letters[letters.length - 1];
  const out = gsap.parseEase("power3.out");
  const follow = { t: 0 };
  tl.to(follow, {
    t: 1, duration: .8, ease: "none",
    onUpdate() {
      const k = out(Math.min(1, (follow.t * .8) / .32));
      sel.r = 100 + (LETTER_RIGHT + 9 + Number(gsap.getProperty(last, "x")) - 100) * k;
      draw();
    },
  }, at + .68)
    .to(sel, { l: "-=8", r: "+=8", t: "-=3", b: "+=3", bw: .6, hk: 0, duration: .6, ease: "sine.inOut", onUpdate: draw }, at + 1.5)
    .to(frame.g, { attr: { opacity: 0 }, duration: .55, ease: "sine.inOut" }, at + 1.55)
    .addLabel("panel", at + 1.2);
  return tl;
}

/* ---------- Состояние установки ---------- */
const views = { progress: $("vProgress"), done: $("vDone"), error: $("vError"), warn: $("vWarn") };
let introDone = false;
let pending = "progress";
let target = 0, shown = 0;
let state = { version: "", dir: "", update: false };

function show(name) {
  pending = name;
  if (!introDone) return;
  for (const [key, view] of Object.entries(views)) view.classList.toggle("on", key === name);
  if (name === "done") $("launch").focus();
}

(function smooth() {
  shown += (target - shown) * .14;
  if (Math.abs(target - shown) < .05) shown = target;
  $("fill").style.width = `${shown}%`;
  $("pct").textContent = `${Math.floor(shown)}%`;
  requestAnimationFrame(smooth);
})();

function warn(text, buttons) {
  $("warnText").textContent = text;
  const box = $("warnActions");
  box.replaceChildren();
  for (const [label, action, ghost] of buttons) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = ghost ? "btn ghost" : "btn";
    b.textContent = label;
    b.addEventListener("click", action);
    box.appendChild(b);
  }
  show("warn");
}

window.__setup = (e) => {
  switch (e.type) {
    case "init":
      state = e;
      $("ver").textContent = `v${e.version}`;
      $("path").textContent = e.dir;
      $("doneText").textContent = `${e.update ? "Fetchr обновлён" : "Fetchr установлен"} · v${e.version}`;
      if (e.cpu === "no-avx") {
        warn("Этот процессор не поддерживает инструкции AVX, поэтому Fetchr на нём не запустится.", [["Закрыть", () => post("close")]]);
      } else if (e.cpu === "no-avx2") {
        warn("Процессор не поддерживает AVX2. Нейросетевые инструменты Fetchr могут работать медленно или не запускаться.", [
          ["Установить всё равно", () => { show("progress"); post("start"); }],
          ["Отмена", () => post("close"), true],
        ]);
      } else {
        post("start");
      }
      intro.play();
      break;
    case "step":
      $("label").textContent = e.label;
      bg.flow = .2;
      break;
    case "progress":
      target = Math.min(99, (e.done / e.total) * 100);
      if (e.label) $("label").textContent = `Распаковка ${e.label}`;
      bg.flow = 1;
      break;
    case "done":
      target = 100;
      bg.flow = 0;
      setTimeout(() => show("done"), introDone ? 450 : 0);
      break;
    case "error":
      bg.flow = 0;
      $("errText").textContent = e.message;
      show("error");
      break;
    case "cancelling":
      $("label").textContent = "Отменяем установку…";
      break;
    case "busy":
      $("label").textContent = "Обновление нельзя прервать — осталось немного";
      break;
  }
};

const intro = buildIntro();
intro.call(() => { introDone = true; show(pending); }, null, "panel");

$("launch").addEventListener("click", () => post("launch"));
$("retry").addEventListener("click", () => { target = shown = 0; show("progress"); post("start"); });
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => post("close")));
$("close").addEventListener("click", () => post("close"));
$("min").addEventListener("click", () => post("minimize"));
$("drag").addEventListener("mousedown", (e) => { if (e.button === 0 && !e.target.closest("button")) post("drag"); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && views.done.classList.contains("on")) post("launch");
  if (e.key === "Escape") post("close");
});
document.addEventListener("contextmenu", (e) => e.preventDefault());

// Вне установщика (просмотр в браузере) — имитация установки
if (!window.ipc) {
  setTimeout(() => {
    window.__setup({ type: "init", version: "0.9.0", dir: "C:\\Users\\user\\AppData\\Local\\Fetchr", update: false, cpu: "ok" });
    const files = ["fetchr.exe", "yt-dlp.exe", "N_m3u8DL-RE.exe", "ffmpeg.exe", "ffprobe.exe"];
    let done = 0;
    const tick = setInterval(() => {
      done += 2.2;
      window.__setup({ type: "progress", done, total: 100, label: files[Math.min(4, Math.floor(done / 20))] });
      if (done >= 100) { clearInterval(tick); window.__setup({ type: "step", label: "Регистрируем Fetchr в системе" }); setTimeout(() => window.__setup({ type: "done", dir: "" }), 600); }
    }, 120);
  }, 200);
} else {
  post("ready");
}
</script>
</body>
</html>
