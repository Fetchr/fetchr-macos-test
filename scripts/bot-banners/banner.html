<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Fetchr bot banner</title>
<style>
  /* Same files as the app's "Inter Variable" (@fontsource-variable/inter). */
  @font-face {
    font-family: "Inter";
    src: url("/fonts/inter-latin.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215;
  }
  @font-face {
    font-family: "Inter";
    src: url("/fonts/inter-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("/fonts/jetbrains-latin.woff2") format("woff2");
    font-weight: 100 800;
  }

  :root {
    --canvas: #0b0d12;
    --text: #f3f6fb;
    --mute: #a4aebe;
    --accent-bright: #86abff;
    --accent: #3d7dff;
    --line-subtle: #191e28;
    --stripe-start: #3d7dff;
    --stripe-end: #2e63d6;
    --success: #2fd49b;
    /* The app's wordmark fill (IntroSplash .word) */
    --word-fill: linear-gradient(var(--text), var(--text));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w, 960px); height: var(--h, 320px); overflow: hidden; background: var(--canvas); }
  body {
    font-family: "Inter", system-ui, sans-serif;
    font-feature-settings: "calt", "kern", "liga", "ss03";
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: relative; width: var(--w, 960px); height: var(--h, 320px); overflow: hidden; isolation: isolate; }
  .backdrop {
    position: absolute; inset: 0; z-index: -4;
    background: var(--canvas);
  }

  /* ── Home: the intro splash lockup, word = 13/18 of the mark ─────────── */
  .lockup {
    --mark: 172px;
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    gap: calc(var(--mark) * 8 / 18); padding-bottom: 4px;
  }
  .markWrap { position: relative; flex: none; width: var(--mark); height: var(--mark); }
  .markWrap svg { position: relative; display: block; width: 100%; height: 100%; }
  .glow {
    position: absolute; inset: calc(var(--mark) * -2); border-radius: 50%;
    background: none;
  }
  .word {
    position: relative;
    font-size: calc(var(--mark) * 13 / 18); font-weight: 600; letter-spacing: 0.01em; line-height: 1; white-space: nowrap;
    background: var(--word-fill); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  /* A band of light crossing the word, clipped to the letters */
  .word .shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,0.95) 50%, transparent 58%) no-repeat;
    background-size: 300% 100%;
    display: none;
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ── Sections: tile painted like the logo's tile ───────────────────── */
  .grid {
    position: absolute; inset: 0; z-index: -3;
    background-image:
      linear-gradient(var(--line-subtle) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-subtle) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 60% 120% at 16% 50%, #000 0%, transparent 72%);
  }
  .sideGlow {
    position: absolute; z-index: -2; width: 560px; height: 560px; left: -126px; top: -120px; border-radius: 50%;
    background: none;
  }
  .stripes { position: absolute; inset: -200px; z-index: -1; transform: rotate(-24deg); }
  .stripes i {
    position: absolute; top: 0; bottom: 0; width: 46px;
    background: linear-gradient(180deg, transparent 0%, var(--stripe-start) 40%, var(--stripe-end) 72%, transparent 100%);
  }
  .tileWrap { position: absolute; left: 58px; top: 60px; width: 200px; height: 200px; z-index: 1; }
  .tileWrap svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .copy { position: absolute; left: 300px; top: 0; bottom: 0; right: 36px; display: flex; flex-direction: column; justify-content: center; z-index: 1; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 34px; height: 34px; display: block; }
  .brand span {
    font-size: 25px; font-weight: 600; letter-spacing: 0.01em; line-height: 1;
    background: var(--word-fill); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand em { font-style: normal; font-size: 21px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-bright); margin-left: 6px; }
  .brand em.ver { text-transform: none; letter-spacing: 0.04em; }
  h1 {
    margin-top: 14px; font-size: 80px; line-height: 1; font-weight: 600; letter-spacing: -0.01em;
    background: var(--word-fill); -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-bottom: 6px;
  }
  p.sub { margin-top: 8px; font-size: 29px; font-weight: 500; color: var(--mute); }

  .extra { margin-top: 18px; height: 32px; display: flex; align-items: center; gap: 14px; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 25px; font-weight: 600; color: var(--accent-bright); white-space: pre; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px; height: 34px; padding: 0 16px; border-radius: 99px;
    border: 1px solid rgba(47,212,155,0.35); background: rgba(47,212,155,0.10);
    font-size: 21px; font-weight: 600; color: var(--success);
  }
  .pill .led { width: 10px; height: 10px; border-radius: 50%; background: var(--success); box-shadow: 0 0 12px var(--success); }
  .bar { position: relative; width: 300px; height: 8px; border-radius: 99px; background: rgba(243,246,251,0.08); overflow: hidden; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); }
  .label { font-size: 22px; font-weight: 600; color: var(--mute); }
</style>
</head>
<body>
<div id="stage"><div class="backdrop"></div></div>
<script>
  const TAU = Math.PI * 2;
  const clamp = (value, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, value));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const wave = (t, phase = 0) => Math.sin((t + phase) * TAU);

  /* The app logo, from src/ui/redesign/intro/IntroMark.tsx: same 200-unit
     frame, tile, gradients, glyph and edge — static, with an optional sheen. */
  const TILE = { x: 13.1, y: 13.4, size: 174, radius: 30.4 };
  const GLYPH =
    "M81.93 168.93C79.67 168.93 77.84 167.1 77.84 164.84L77.84 77C77.84 54.07 95.13 36.17 " +
    "115.93 36.17L132.82 36.17C134.24 36.17 135.38 37.31 135.38 38.73L135.38 56.72C135.38 " +
    "57.55 134.71 58.22 133.88 58.22L119.82 59.46C111.45 59.46 104.44 67.52 104.44 76.94L104.44 " +
    "164.84C104.44 167.1 102.61 168.93 100.35 168.93Z";
  const BAR = { x: 59.48, y: 91.43, width: 70.65, height: 21.69, radius: 2.54 };

  const tileRect = (extra = "") =>
    `<rect x="${TILE.x}" y="${TILE.y}" width="${TILE.size}" height="${TILE.size}" rx="${TILE.radius}" ${extra}/>`;

  function tileDefs(id) {
    return `
      <linearGradient id="${id}-tile" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#141821"/>
      </linearGradient>
      <radialGradient id="${id}-light" cx="0.3" cy="0" r="0.9">
        <stop offset="0" stop-color="#86abff" stop-opacity="0"/><stop offset="1" stop-color="#86abff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="${id}-edge" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f3f6fb" stop-opacity="0.16"/><stop offset="1" stop-color="#f3f6fb" stop-opacity="0.16"/>
      </linearGradient>
      <linearGradient id="${id}-glyph" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="169">
        <stop offset="0" stop-color="#3d7dff"/><stop offset="1" stop-color="#3d7dff"/>
      </linearGradient>
      <linearGradient id="${id}-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0" gradientTransform="rotate(20 100 100) translate(-230 0)">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="${id}-clip">${tileRect()}</clipPath>`;
  }

  /** A tile in the logo's paint with any content on it. */
  function tileSvg(id, content) {
    return `<svg viewBox="0 0 200 200" aria-hidden="true"><defs>${tileDefs(id)}</defs>
      <g clip-path="url(#${id}-clip)">
        ${tileRect(`fill="url(#${id}-tile)"`)}
        ${tileRect(`fill="url(#${id}-light)"`)}
        ${content}
        ${tileRect(`fill="url(#${id}-sheen)"`)}
      </g>
      <rect x="${TILE.x + 0.75}" y="${TILE.y + 0.75}" width="${TILE.size - 1.5}" height="${TILE.size - 1.5}" rx="${TILE.radius - 0.75}"
            fill="none" stroke="url(#${id}-edge)" stroke-width="1.5"/>
    </svg>`;
  }

  const logoSvg = (id) =>
    tileSvg(id, `<path d="${GLYPH}" fill="url(#${id}-glyph)"/>
      <rect x="${BAR.x}" y="${BAR.y}" width="${BAR.width}" height="${BAR.height}" rx="${BAR.radius}" fill="url(#${id}-glyph)"/>`);

  /** Section glyphs are drawn on a 24-unit grid, centred on the tile. */
  const glyph = (id, body) =>
    `<g transform="translate(40 40) scale(5)" fill="none" stroke="url(#${id}-glyph24)" stroke-linecap="round" stroke-linejoin="round">
       <defs><linearGradient id="${id}-glyph24" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="22">
         <stop offset="0" stop-color="#3d7dff"/><stop offset="1" stop-color="#3d7dff"/>
       </linearGradient></defs>${body}</g>`;

  const brand = (tag = "") => `<div class="brand">${logoSvg("mini")}<span>Fetchr</span>${tag ? `<em${/^v[0-9]/.test(tag) ? ' class="ver"' : ""}>${tag}</em>` : ""}</div>`;

  function setSheen(id, t, from, to) {
    const gradient = document.getElementById(`${id}-sheen`);
    if (!gradient) return;
    const shift = -230 + clamp((t - from) / (to - from)) * 460;
    gradient.setAttribute("gradientTransform", `rotate(20 100 100) translate(${shift.toFixed(2)} 0)`);
  }

  const KINDS = {
    home: {
      build() {
        return `<div class="lockup">
          <div class="markWrap"><div class="glow" id="glow"></div>${logoSvg("big")}</div>
          <div class="word">Fetchr<span class="shimmer" id="shimmer">Fetchr</span></div>
        </div>`;
      },
      frame(t) {
        setSheen("big", t, 0.1, 0.45);
        const shimmer = document.getElementById("shimmer");
        const pass = clamp((t - 0.3) / 0.45);
        shimmer.style.backgroundPosition = `${(100 - pass * 150).toFixed(2)}% 0`;
        document.getElementById("glow").style.opacity = (0.82 + 0.18 * wave(t)).toFixed(3);
      },
    },
    register: {
      tag: "",
      title: "Регистрация",
      sub: "Бесплатный ключ активации",
      glyph: `<g stroke-width="2.3"><circle cx="8" cy="8" r="4.6"/><path d="M11.3 11.3 20 20"/><path d="M15.4 15.4l2.2-2.2"/><path d="M17.8 17.8l1.8-1.8"/></g>`,
      extra: `<span class="mono" id="key"></span>`,
      frame(t) {
        const target = "FTR1.eyJ2IjoxLCJwcm9k";
        const glyphs = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";
        const revealed = Math.floor(ease(t / 0.7) * target.length);
        const noise = Math.floor(t * 100);
        let text = target.slice(0, revealed);
        for (let index = revealed; index < target.length; index += 1) {
          text += glyphs[(index * 7 + noise * 13) % glyphs.length];
        }
        const key = document.getElementById("key");
        key.textContent = text;
        key.style.opacity = t > 0.92 ? String(1 - (t - 0.92) / 0.08) : "1";
      },
    },
    support: {
      tag: "",
      title: "Поддержка",
      sub: "Ответим прямо в этом чате",
      glyph: `<path stroke-width="2.2" d="M5.5 4.5h13a2.5 2.5 0 0 1 2.5 2.5v7.5a2.5 2.5 0 0 1-2.5 2.5H10.5l-4.2 3.4V17H5.5A2.5 2.5 0 0 1 3 14.5V7a2.5 2.5 0 0 1 2.5-2.5z"/>
              <g stroke="none" fill="#3d7dff"><circle id="d0" cx="8.3" cy="10.8" r="1.35"/><circle id="d1" cx="12" cy="10.8" r="1.35"/><circle id="d2" cx="15.7" cy="10.8" r="1.35"/></g>`,
      extra: `<span class="pill"><span class="led" id="led"></span>на связи</span>`,
      frame(t) {
        for (let index = 0; index < 3; index += 1) {
          const lift = Math.max(0, Math.sin((t * 3 - index * 0.16) * TAU));
          document.getElementById(`d${index}`).setAttribute("transform", `translate(0 ${(-1.4 * lift).toFixed(3)})`);
        }
        document.getElementById("led").style.opacity = (0.55 + 0.45 * (0.5 + 0.5 * wave(t * 2))).toFixed(3);
      },
    },
    shop: {
      tag: "Архив VPS",
      title: "Магазин",
      sub: "Облачная запись стримов 24/7",
      glyph: `<g stroke-width="2.1"><rect x="3" y="3.8" width="18" height="7" rx="2.2"/><rect x="3" y="13.2" width="18" height="7" rx="2.2"/><path d="M11 7.3h6.5"/><path d="M11 16.7h6.5"/></g>
              <g stroke="none" fill="#3d7dff"><circle id="l0" cx="6.8" cy="7.3" r="1.2"/><circle id="l1" cx="6.8" cy="16.7" r="1.2"/></g>`,
      extra: `<div class="bar"><div class="fill" id="fill"></div></div><span class="label" id="gb"></span>`,
      frame(t) {
        document.getElementById("l0").style.opacity = wave(t * 4) > 0 ? "1" : "0.25";
        document.getElementById("l1").style.opacity = wave(t * 4, 0.37) > 0 ? "1" : "0.25";
        const progress = ease(t / 0.8);
        const fade = t > 0.9 ? String(1 - (t - 0.9) / 0.1) : "1";
        document.getElementById("fill").style.width = `${(progress * 100).toFixed(2)}%`;
        document.getElementById("fill").style.opacity = fade;
        const gb = document.getElementById("gb");
        gb.textContent = `${Math.round(progress * 150)} ГБ`;
        gb.style.opacity = fade;
      },
    },
    update: {
      logo: true,
      plain: true,
      tag: "",
      title: "Обновление",
      sub: "Новая версия Fetchr уже доступна",
      extra: `<div class="bar" style="width:420px"><div class="fill" id="fill"></div></div><span class="label" id="pct"></span>`,
      frame(t) {
        const progress = ease(t / 0.6);
        const fade = t > 0.9 ? String(1 - (t - 0.9) / 0.1) : "1";
        const fill = document.getElementById("fill");
        fill.style.width = `${(progress * 100).toFixed(2)}%`;
        fill.style.opacity = fade;
        const label = document.getElementById("pct");
        label.textContent = progress >= 0.999 ? "Готово ✓" : `${Math.round(progress * 100)}%`;
        label.style.color = progress >= 0.999 ? "var(--success)" : "";
        label.style.opacity = fade;
      },
    },
  };

  const params = new URLSearchParams(location.search);
  const name = params.get("kind") || "home";
  document.documentElement.style.setProperty("--w", `${params.get("w") || 960}px`);
  document.documentElement.style.setProperty("--h", `${params.get("h") || 320}px`);
  if (params.get("v")) KINDS.update.tag = `v${params.get("v")}`;
  const kind = KINDS[name];
  const stage = document.getElementById("stage");

  // Stripes alternate in strength, so one loop moves them two slots: each
  // lands where a stripe of the same strength started.
  const PERIOD = 190;
  let stripes = [];

  if (name === "home") {
    stage.insertAdjacentHTML("beforeend", kind.build());
  } else {
    stage.insertAdjacentHTML(
      "beforeend",
      `<div class="grid"></div><div class="sideGlow" id="glow"></div>
       <div class="stripes" id="stripes">${"<i></i>".repeat(12)}</div>
       <div class="tileWrap">${kind.logo ? logoSvg("sec") : tileSvg("sec", glyph("sec", kind.glyph))}</div>
       <div class="copy">${kind.plain && !kind.tag ? "" : brand(kind.tag)}<h1>${kind.title}</h1><p class="sub">${kind.sub}</p><div class="extra">${kind.extra}</div></div>`,
    );
    stripes = [...document.querySelectorAll("#stripes i")];
  }

  /** Draws the frame at loop position t in [0, 1): everything periodic, so
   *  frame 0 follows the last frame without a seam. */
  window.renderAt = (t) => {
    stripes.forEach((stripe, index) => {
      stripe.style.left = `${(index - 2) * PERIOD + t * 2 * PERIOD}px`;
      stripe.style.opacity = (0.08 + 0.07 * (index % 2)).toFixed(3);
    });
    if (name !== "home") {
      setSheen("sec", t, 0.08, 0.4);
      document.getElementById("glow").style.opacity = (0.85 + 0.15 * wave(t)).toFixed(3);
    }
    kind.frame(t);
  };
  window.renderAt(0);
  window.bannerReady = document.fonts.ready.then(() => true);
</script>
</body>
</html>
